[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-lab"
version = "0.1.0"
description = "Projetos práticos de Inteligência Artificial e Automação."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
